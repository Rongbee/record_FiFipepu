<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 加入 Viewport 讓手機端按鈕自動放大，方便單手按壓 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>霏寶紀錄器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .btn {
      font-size: 1.5rem;
      padding: 15px 30px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 80%;
      max-width: 300px;
    }
    .btn-pupu { background-color: #ffeaa7; }
    .btn-pepe { background-color: #74b9ff; color: white; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>

<body>
 
  <h1>👶 霏寶紀錄器(V11)</h1>
 
  <button id="btnPupu" class="btn btn-pupu" onclick="sendRecord('pupu', 'btnPupu', '💩 大便')">💩 大便</button>
  <br>
  <button id="btnPepe" class="btn btn-pepe" onclick="sendRecord('pepe', 'btnPepe', '💦 尿尿')">💦 尿尿</button>
  <br><br>
	<h2>今日統計</h2>
	  <div class="count">
		💩 大便：
		<span id="pupuCount">0</span>
		次
	  </div>
	  <div class="count">
		💦 尿尿：
		<span id="pepeCount">0</span>
		次
	  </div>
	  <br>
		
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzlpCX_Ffmmrg7b2nKbvpsAiQBVYcCT0Zap4CR1HhXvEH4RPJyh2WEGFWeCq7Gvvcbcxg/exec";

    function sendRecord(type, btnId, originalText) {
      const btn = document.getElementById(btnId);
      
      // 防止重複快速點擊
	  
      btn.disabled = true;
      btn.innerText = "寫入中...";

      // 不使用 mode: 'no-cors'  GAS 跨網域回應可能被瀏覽器擋下
      fetch(API_URL + "?type=" + type)
	  // 把 GAS 回傳的 JSON 解析成 JavaScript 物件
        .then(response => response.json())
	  // 取得統計資料
        .then(data => {
          console.log("GAS 回傳：", data);
          // ========================================
          // 更新今日統計
          // ========================================
          document.getElementById("pupuCount").innerText =
            data.pupu;
          document.getElementById("pepeCount").innerText =
            data.pepe;
          // ========================================
          // 顯示成功
          // ========================================
          btn.innerText = "✅ 已記錄！";
          // ========================================
          // 1.5 秒後恢復按鈕
          // ========================================
          setTimeout(() => {
            btn.innerText = originalText;
            btn.disabled = false;
          }, 1500);
        })
        .catch(error => {
          console.error("錯誤：", error);
		  alert("記錄失敗，請檢查網路連線！");
          btn.innerText = originalText;
          btn.disabled = false;
        });
    }
  </script>

</body>
</html>
